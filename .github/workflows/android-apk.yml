name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Create Capacitor Android project
        run: |
          npx cap add android
          npx cap copy android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/kharid-yar-release.jks" \
            -storepass "kharid-yar-temp-pass" \
            -alias "kharid-yar" \
            -keypass "kharid-yar-temp-pass" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NziCode, OU=Apps, O=NziCode, L=Tehran, S=Tehran, C=IR"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/kharid-yar-release.jks" \
            -Pandroid.injected.signing.store.password="kharid-yar-temp-pass" \
            -Pandroid.injected.signing.key.alias="kharid-yar" \
            -Pandroid.injected.signing.key.password="kharid-yar-temp-pass"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: kharid-yar-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
