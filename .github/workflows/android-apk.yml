name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: |
          npm run build:web
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html

      - name: Create Capacitor Android project
        run: |
          npx cap add android
          npx cap copy android
          mkdir -p android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp assets/app-icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/kharid-yar-release.jks"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/kharid-yar-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/KharidYar.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: KharidYar-Android
          path: android/app/build/outputs/apk/release/KharidYar.apk
          if-no-files-found: error
