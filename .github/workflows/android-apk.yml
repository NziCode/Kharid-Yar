name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK with Expo bundling
        run: npx expo run:android --variant release --no-install

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: kharid-yar-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
